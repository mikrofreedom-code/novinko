<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Novinko — Článok</title>
  <!-- noindex zámerne: túto stránku skladá až JavaScript, takže vyhľadávaču sa
       všetkých ~50 článkov javí ako jedna prázdna stránka s týmto titulkom.
       Indexovateľnú verziu s obsahom skladá netlify/functions/clanok.js na
       adrese /clanok/<slug>-<id> a odkazuje na ňu sitemap.xml. Táto adresa
       zostáva funkčná pre už rozposlané odkazy (Telegram, X). -->
  <meta name="robots" content="noindex, follow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/clanok.css" />
</head>
<body>

<header>
  <div class="header-inner">
    <a href="/" class="back-btn">← Späť</a>
    <a href="/" class="logo">novinko<span>.</span></a>
    <span class="logo-tagline">Píše AI. Človek kontroluje.</span>
  </div>
</header>

<div class="article-wrap" id="articleWrap">
  <div class="loading">
    <div class="loader"></div>
    <span>Načítavam článok…</span>
  </div>
</div>

<footer>novinko &mdash; všetky aktuálne správy na jednom mieste<span style="display:flex;gap:16px;align-items:center;justify-content:center;margin-top:10px"><a href="https://www.tiktok.com/@novinko.sk" target="_blank" rel="noopener me" aria-label="Novinko na TikToku" title="Novinko na TikToku" style="color:var(--text2);display:inline-flex;align-items:center"><svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></svg></a><a href="https://x.com/novinkosk" target="_blank" rel="noopener me" aria-label="Novinko na X" title="Novinko na X" style="color:var(--text2);display:inline-flex;align-items:center"><svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg></a></span></footer>

<script>
  const SHEET_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTZoj1iM9WKbX_S-0Zsu-3ZU3vZGro3UFcWyGuuBY4e8sR474C9X0xf33N1Cok0YSqoLDVPn_dCVFXW/pub?output=csv";
  const PARAGRAPH_DELIM = "¶¶"; // musí sedieť s backendom (lib/config.js)

  // bezpečnostné helpery
  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c =>
      ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }
  function safeLink(url) {
    try {
      const u = new URL(url, location.origin);
      return ['http:', 'https:'].includes(u.protocol) ? u.href : '#';
    } catch { return '#'; }
  }

  // robustný CSV parser (zvláda úvodzovky aj zdvojené "")
  function parseCSVLine(line) {
    const cols = [];
    let cur = "", inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') {
        if (inQuotes && line[i + 1] === '"') { cur += '"'; i++; }
        else inQuotes = !inQuotes;
      } else if (ch === "," && !inQuotes) { cols.push(cur); cur = ""; }
      else cur += ch;
    }
    cols.push(cur);
    return cols.map(c => c.trim());
  }

  function parseCSV(csv) {
    const lines = csv.trim().split("\n").filter(l => l.trim());
    if (lines.length <= 1) return [];
    const headers = parseCSVLine(lines[0]);
    return lines.slice(1).map(line => {
      const cols = parseCSVLine(line);
      const obj = {};
      headers.forEach((h, i) => obj[h] = cols[i] || "");
      return obj;
    });
  }

  function timeAgo(iso) {
    const t = new Date(iso).getTime();
    if (isNaN(t)) return '';
    const diff = (Date.now() - t) / 1000;
    if (diff < 60) return 'práve teraz';
    if (diff < 3600) return `${Math.floor(diff/60)} min`;
    if (diff < 86400) return `${Math.floor(diff/3600)} hod`;
    return `${Math.floor(diff/86400)} d`;
  }

  // Plný dátum a čas zverejnenia (slovenský čas) — pri každom našom článku.
  function formatDateTime(iso) {
    const d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return d.toLocaleString('sk-SK', {
      timeZone: 'Europe/Bratislava',
      day: 'numeric', month: 'long', year: 'numeric',
      hour: '2-digit', minute: '2-digit',
    });
  }

  function showMessage(msg) {
    document.getElementById("articleWrap").innerHTML =
      `<div class='loading'><span>${esc(msg)}</span></div>`;
  }

  async function loadArticle() {
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
    if (!id) { showMessage("Článok nenájdený"); return; }

    try {
      const res = await fetch(SHEET_CSV);
      const csv = await res.text();
      const rows = parseCSV(csv);

      // nájdi článok podľa id (prvý stĺpec)
      const article = rows.find(r => Object.values(r)[0] === id);
      if (!article) { showMessage("Článok nenájdený"); return; }

      const vals = Object.values(article);
      const [aId, title, perex, content, source, date, category, imageUrl, imageCredit] = vals;

      document.title = `${title} — Novinko`;

      // zdroj: "Názov | link"
      const sourceParts = String(source || "").split("|");
      const sourceName = (sourceParts[0] || "").trim();
      const sourceLink = (sourceParts[1] || "").trim();

      // odseky: rozdeľ podľa oddeľovača (¶¶) aj podľa prípadných \n\n
      const contentHTML = String(content || "")
        .split(new RegExp(`\\s*${PARAGRAPH_DELIM}\\s*|\\n\\n`))
        .map(p => p.trim())
        .filter(Boolean)
        .map(p => `<p>${esc(p)}</p>`)
        .join("");

      document.getElementById("articleWrap").innerHTML = `
        <div class="article-meta">
          <span class="cat-badge">${esc(category || "správy")}</span>
          <span class="article-source">tím Novinko</span>
          <span class="article-date"><time datetime="${esc(date)}">${formatDateTime(date)}</time></span>
        </div>
        <h1 class="article-title">${esc(title)}</h1>
        ${imageUrl ? `<figure class="article-figure"><img src="${esc(imageUrl)}" alt="" class="article-img" loading="lazy">${
          // Priečinok v ceste nesie pôvod obrázka: manual/ = fotka od človeka,
          // krypto|ai|evergreen = vygenerované AI. Popisok o AI sa preto zobrazí
          // len pri AI ilustrácii — pod skutočnou fotkou by bol nepravdivý.
          // Zadaný zdroj má prednosť: pri prevzatej fotke je atribúcia povinná
          // podľa autorského práva, kým popisok o AI je len informatívny.
          imageCredit
            ? `<figcaption class="img-credit">Foto: ${esc(imageCredit)}</figcaption>`
            : (/\/manual\//.test(imageUrl)
                ? ''
                : `<figcaption class="img-credit">Ilustračný obrázok vytvorený umelou inteligenciou</figcaption>`)
        }</figure>` : ''}
        <div class="article-perex">${esc(perex)}</div>
        <div class="ad-slot">
          <!-- Google AdSense banner 728x90 -->
          Reklamný priestor
        </div>
        <div class="article-content">${contentHTML}</div>
        <div class="article-footer">
          <div class="source-link">
            ${sourceLink ? `Zdroj: <a href="${safeLink(sourceLink)}" target="_blank" rel="noopener">${esc(sourceName)}</a>` : `Zdroj: ${esc(sourceName)}`}
          </div>
          <a href="/" class="back-link">← Všetky správy</a>
        </div>
      `;
    } catch (e) {
      showMessage("Chyba pri načítavaní");
    }
  }

  loadArticle();
</script>
</body>
</html>

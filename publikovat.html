<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Publikovať článok — Novinko</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #1a1a1a; }
  h1 { font-size: 1.3rem; }
  label { display: block; margin-top: 16px; font-weight: 600; font-size: 0.9rem; }
  input, textarea, select { width: 100%; box-sizing: border-box; padding: 8px; margin-top: 4px; font-size: 1rem; border: 1px solid #ccc; border-radius: 4px; }
  textarea { min-height: 160px; font-family: inherit; }
  small { color: #666; }
  button { margin-top: 20px; padding: 10px 20px; font-size: 1rem; background: #111; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
  #status { margin-top: 16px; padding: 10px; border-radius: 4px; display: none; }
  #status.ok { display: block; background: #e6f7e6; color: #1a5c1a; }
  #status.err { display: block; background: #fbe6e6; color: #8a1a1a; }
</style>
</head>
<body>
<h1>Publikovať článok ručne</h1>

<form id="f">
  <label>Heslo
    <input type="password" name="password" required>
  </label>

  <label>Titulok
    <input type="text" name="headline" required>
  </label>

  <label>Perex (1-2 vety zhrnutia)
    <textarea name="perex" style="min-height:60px"></textarea>
  </label>

  <label>Text článku
    <textarea name="text" required></textarea>
    <small>Odseky odděľuj prázdnym riadkom (Enter dvakrát).</small>
  </label>

  <label>Kategória
    <select name="category">
      <option value="krypto">Krypto</option>
      <option value="ai">AI</option>
    </select>
  </label>

  <label>Zdroj (meno)
    <input type="text" name="source" placeholder="napr. Polícia SR">
  </label>

  <label>Zdroj (odkaz)
    <input type="url" name="sourceUrl" placeholder="https://...">
  </label>

  <label>Vlastná fotka (voliteľné)
    <input type="file" name="imageFile" id="imageFile" accept="image/jpeg,image/png,image/webp,image/gif,image/avif">
    <small>Vyber súbor z počítača alebo telefónu. Má prednosť pred odkazom aj pred AI ilustráciou. Maximum 4 MB.</small>
  </label>

  <label>Zdroj obrázka (autor, agentúra)
    <input type="text" name="imageCredit" placeholder="napr. Ján Novák / TASR, alebo Vlastná fotografia">
    <small>Vyplň pri vlastnej alebo prevzatej fotke — zobrazí sa pod obrázkom v článku. Pri AI ilustrácii nechaj prázdne, tam sa uvádza automatický popisok.</small>
  </label>

  <label>Obrázok (odkaz, voliteľné)
    <input type="url" name="imageUrl" placeholder="https://....supabase.co/... (nechaj prázdne, ak nahrávaš fotku vyššie)">
    <small>Funguje len odkaz do vlastného úložiska (<code>*.supabase.co</code>). Odkaz z iného webu prehliadač zablokuje kvôli CSP, tak ho formulár odmietne.</small>
  </label>

  <label style="display:flex; align-items:center; gap:8px; font-weight:normal;">
    <input type="checkbox" name="generateAiImage" value="true" style="width:auto; margin:0;">
    Vygenerovať AI ilustráciu (ak nie je zadaný odkaz vyššie)
  </label>

  <label>Vlastný prompt pre AI ilustráciu (voliteľné)
    <input type="text" name="imagePrompt" placeholder="napr. golden bitcoin coin over dark city skyline, dramatic lighting">
    <small>Nechaj prázdne a zaškrtni políčko vyššie, ak chceš automatický prompt podľa titulku/kategórie. Vyplň toto pole, ak chceš vlastnú predstavu — netreba potom zaškrtávať checkbox.</small>
  </label>

  <button type="submit" id="btn">Publikovať</button>
</form>

<div id="status"></div>

<script>
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn');
  const status = document.getElementById('status');
  const data = Object.fromEntries(new FormData(e.target));

  btn.disabled = true;
  btn.textContent = 'Publikujem...';
  status.style.display = 'none';

  try {
    // Fotku pošleme ako base64 v JSON tele. Netlify má strop ~6 MB a base64
    // nafúkne dáta o ~37 %, preto 4 MB na pôvodný súbor. Funkcia si to overuje
    // znova — táto kontrola je pre pohodlie, nie ako ochrana.
    const subor = document.getElementById('imageFile').files[0];
    delete data.imageFile;
    if (subor) {
      const MAX = 4 * 1024 * 1024;
      if (subor.size > MAX) {
        throw new Error('Fotka má ' + (subor.size / 1024 / 1024).toFixed(1) + ' MB, maximum je 4 MB. Zmenši ju a skús znova.');
      }
      btn.textContent = 'Nahrávam fotku...';
      const buf = await subor.arrayBuffer();
      let bin = '';
      const bytes = new Uint8Array(buf);
      for (let i = 0; i < bytes.length; i += 8192) {
        bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
      }
      data.imageBase64 = btoa(bin);
      data.imageType = subor.type;
      btn.textContent = 'Publikujem...';
    }

    const res = await fetch('/.netlify/functions/manual-publish', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data),
    });
    const j = await res.json();
    if (res.ok && j.ok) {
      status.className = 'ok';
      status.textContent = '✅ Publikované (id: ' + j.id + '). Telegram: ' + j.telegram;
      e.target.reset();
    } else {
      status.className = 'err';
      status.textContent = '❌ ' + (j.error || 'neznáma chyba');
    }
  } catch (err) {
    status.className = 'err';
    status.textContent = '❌ ' + err.message;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Publikovať';
  }
});
</script>
</body>
</html>

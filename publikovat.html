<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Publikovať článok — Novinko</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #1a1a1a; }
  h1 { font-size: 1.3rem; }
  label { display: block; margin-top: 16px; font-weight: 600; font-size: 0.9rem; }
  input, textarea, select { width: 100%; box-sizing: border-box; padding: 8px; margin-top: 4px; font-size: 1rem; border: 1px solid #ccc; border-radius: 4px; }
  textarea { min-height: 160px; font-family: inherit; }
  small { color: #666; }
  button { margin-top: 20px; padding: 10px 20px; font-size: 1rem; background: #111; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
  #status { margin-top: 16px; padding: 10px; border-radius: 4px; display: none; }
  #status.ok { display: block; background: #e6f7e6; color: #1a5c1a; }
  #status.err { display: block; background: #fbe6e6; color: #8a1a1a; }
</style>
</head>
<body>
<h1>Publikovať článok ručne</h1>

<form id="f">
  <label>Heslo
    <input type="password" name="password" required>
  </label>

  <label>Titulok
    <input type="text" name="headline" required>
  </label>

  <label>Perex (1-2 vety zhrnutia)
    <textarea name="perex" style="min-height:60px"></textarea>
  </label>

  <label>Text článku
    <textarea name="text" required></textarea>
    <small>Odseky oddeľuj Enterom — stačí raz, prázdny riadok funguje tiež.</small>
  </label>

  <label>Kategória
    <select name="category">
      <option value="krypto">Krypto</option>
      <option value="ai">AI</option>
      <option value="slovensko">Slovensko</option>
      <option value="svet">Svet</option>
      <option value="ekonomika">Ekonomika</option>
      <option value="sport">Šport</option>
    </select>
    <small>Zoznam musí sedieť s POVOLENE_KATEGORIE v manual-publish.js — čokoľvek mimo neho skončí v Krypte.</small>
  </label>

  <label>Zdroj (meno)
    <input type="text" name="source" placeholder="napr. Polícia SR">
  </label>

  <label>Zdroj (odkaz)
    <input type="url" name="sourceUrl" placeholder="https://...">
  </label>

  <label>Vlastná fotka (voliteľné)
    <input type="file" name="imageFile" id="imageFile" accept="image/jpeg,image/png,image/webp,image/gif,image/avif">
    <small>Vyber súbor z počítača alebo telefónu. Má prednosť pred odkazom aj pred AI ilustráciou. Maximum 4 MB.</small>
  </label>

  <label>Zdroj obrázka (autor, agentúra)
    <input type="text" name="imageCredit" placeholder="napr. Ján Novák / TASR, alebo Vlastná fotografia">
    <small>Vyplň pri vlastnej alebo prevzatej fotke — zobrazí sa pod obrázkom v článku. Pri AI ilustrácii nechaj prázdne, tam sa uvádza automatický popisok.</small>
  </label>

  <label>Obrázok (odkaz, voliteľné)
    <input type="url" name="imageUrl" placeholder="https://....supabase.co/... (nechaj prázdne, ak nahrávaš fotku vyššie)">
    <small>Funguje len odkaz do vlastného úložiska (<code>*.supabase.co</code>). Odkaz z iného webu prehliadač zablokuje kvôli CSP, tak ho formulár odmietne.</small>
  </label>

  <label style="display:flex; align-items:center; gap:8px; font-weight:normal;">
    <input type="checkbox" name="generateAiImage" value="true" style="width:auto; margin:0;">
    Vygenerovať AI ilustráciu (ak nie je zadaný odkaz vyššie)
  </label>

  <label>Vlastný prompt pre AI ilustráciu (voliteľné)
    <input type="text" name="imagePrompt" placeholder="napr. golden bitcoin coin over dark city skyline, dramatic lighting">
    <small>Nechaj prázdne a zaškrtni políčko vyššie, ak chceš automatický prompt podľa titulku/kategórie. Vyplň toto pole, ak chceš vlastnú predstavu — netreba potom zaškrtávať checkbox.</small>
  </label>

  <button type="submit" id="btn">Publikovať</button>
</form>

<div id="status"></div>

<script>
// Zmenšenie fotky ešte v prehliadači. Bez neho išiel súbor do úložiska 1:1
// taký, aký vyšiel z fotoaparátu — ručne nahrané fotky mali priemer 1,1 MB,
// kým generované webp majú 50 kB. Crawleri (Ahrefs, Google, náhľady na
// sieťach) ťahajú obrázok ku každému článku zo sitemapu, takže to bol hlavný
// zdroj egressu zo Supabase.
const MAX_SIRKA = 1600;
const KVALITA = 0.82;

// Vráti { blob, typ }. Keď sa zmenšiť nedá alebo by to nepomohlo, vráti
// pôvodný súbor — nikdy nezhoršuj.
async function zmensiFotku(subor) {
  const povodne = { blob: subor, typ: subor.type };
  // Animovaný GIF by prevodom prišiel o animáciu, ten nechávame tak.
  if (subor.type === 'image/gif') return povodne;
  try {
    // imageOrientation: 'from-image' rešpektuje EXIF otočenie. Bez toho by
    // fotky z mobilu mohli skončiť otočené naležato.
    const bitmap = await createImageBitmap(subor, { imageOrientation: 'from-image' });
    const mierka = Math.min(1, MAX_SIRKA / bitmap.width);   // nikdy nezväčšuj
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(bitmap.width * mierka);
    canvas.height = Math.round(bitmap.height * mierka);
    canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
    bitmap.close();
    const blob = await new Promise((res) => canvas.toBlob(res, 'image/webp', KVALITA));
    // Keď prehliadač webp nevie, toBlob ticho vráti PNG — to môže byť väčšie
    // než originál. Preto sa rozhodujeme podľa veľkosti, nie podľa formátu,
    // a typ berieme z blobu, nie natvrdo.
    if (!blob || blob.size >= subor.size) return povodne;
    return { blob, typ: blob.type || 'image/webp' };
  } catch (err) {
    console.warn('[foto] zmenšenie zlyhalo, posielam originál:', err);
    return povodne;
  }
}

document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn');
  const status = document.getElementById('status');
  const data = Object.fromEntries(new FormData(e.target));

  btn.disabled = true;
  btn.textContent = 'Publikujem...';
  status.style.display = 'none';

  try {
    // Fotku najprv zmenšíme (viď zmensiFotku hore), až potom ju pošleme ako
    // base64 v JSON tele. Netlify má strop ~6 MB na telo a base64 nafúkne dáta
    // o ~37 %, preto 4 MB. Po zmenšení sa ten strop prakticky nedá dosiahnuť,
    // takže formulár vezme aj fotku rovno z mobilu — predtým ju odmietol.
    // Funkcia si veľkosť aj typ overuje znova, toto je pre pohodlie.
    const subor = document.getElementById('imageFile').files[0];
    delete data.imageFile;
    if (subor) {
      btn.textContent = 'Spracúvam fotku...';
      const { blob, typ } = await zmensiFotku(subor);
      const MAX = 4 * 1024 * 1024;
      if (blob.size > MAX) {
        throw new Error('Fotka má aj po zmenšení ' + (blob.size / 1024 / 1024).toFixed(1) + ' MB, maximum je 4 MB. Skús inú.');
      }
      btn.textContent = 'Nahrávam fotku...';
      let bin = '';
      const bytes = new Uint8Array(await blob.arrayBuffer());
      for (let i = 0; i < bytes.length; i += 8192) {
        bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
      }
      data.imageBase64 = btoa(bin);
      data.imageType = typ;
      btn.textContent = 'Publikujem...';
    }

    const res = await fetch('/.netlify/functions/manual-publish', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data),
    });
    const j = await res.json();
    if (res.ok && j.ok) {
      status.className = 'ok';
      status.textContent = '✅ Publikované (id: ' + j.id + '). Telegram: ' + j.telegram;
      e.target.reset();
    } else {
      status.className = 'err';
      status.textContent = '❌ ' + (j.error || 'neznáma chyba');
    }
  } catch (err) {
    status.className = 'err';
    status.textContent = '❌ ' + err.message;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Publikovať';
  }
});
</script>
</body>
</html>

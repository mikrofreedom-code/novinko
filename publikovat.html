<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Publikovať článok — Novinko</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #1a1a1a; }
  h1 { font-size: 1.3rem; }
  label { display: block; margin-top: 16px; font-weight: 600; font-size: 0.9rem; }
  input, textarea, select { width: 100%; box-sizing: border-box; padding: 8px; margin-top: 4px; font-size: 1rem; border: 1px solid #ccc; border-radius: 4px; }
  textarea { min-height: 160px; font-family: inherit; }
  small { color: #666; }
  button { margin-top: 20px; padding: 10px 20px; font-size: 1rem; background: #111; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
  #status { margin-top: 16px; padding: 10px; border-radius: 4px; display: none; }
  #status.ok { display: block; background: #e6f7e6; color: #1a5c1a; }
  #status.err { display: block; background: #fbe6e6; color: #8a1a1a; }
  #zahadyFields { display: none; border: 1px solid #d8d0c1; border-radius: 6px; padding: 4px 14px 18px; margin-top: 16px; }
  #zahadyFields legend { padding: 0 6px; font-weight: 700; }
  #preview { display: none; margin: 24px 0; padding: 18px; background: #f8f6f1; border: 1px solid #d8d0c1; line-height: 1.6; }
  #preview h2 { font-family: Georgia, serif; font-size: 1.5rem; margin: 8px 0; }
  .secondary { background: #eee; color: #111; margin-right: 8px; }
</style>
</head>
<body>
<h1>Publikovať článok ručne</h1>

<details>
  <summary>Načítať pripravený koncept Záhad a fenoménov</summary>
  <label>Koncept článku (.json)
    <input type="file" id="draftFile" accept="application/json,.json">
  </label>
  <p><small>Koncept vyplní formulár vrátane zdrojov a SEO. Načítanie nič nepublikuje. Text si skontroluj cez Náhľad; heslo zadaj až pri publikovaní.</small></p>
</details>

<form id="f">
  <label>Heslo
    <input type="password" name="password" required>
  </label>

  <label>Aktualizovať existujúci článok <small>(voliteľné, iba Záhady a fenomény)</small>
    <input type="text" name="articleId" inputmode="numeric" placeholder="ID článku">
    <small>Ak je téma už publikovaná, načítaj ju podľa ID a uprav pôvodný článok. Jeho adresa zostane rovnaká.</small>
  </label>
  <button type="button" id="loadArticleBtn" class="secondary">Načítať článok na úpravu</button>

  <label>Titulok
    <input type="text" name="headline" required>
  </label>

  <label>Perex (1-2 vety zhrnutia)
    <textarea name="perex" style="min-height:60px"></textarea>
  </label>

  <label>Text článku
    <textarea name="text" id="textField" required></textarea>
    <small>Odseky oddeľuj Enterom — stačí raz, prázdny riadok funguje tiež.</small>
  </label>

  <label>Kategória
    <select name="category" id="categorySelect">
      <option value="krypto">Krypto</option>
      <option value="ai">AI</option>
      <option value="slovensko">Slovensko</option>
      <option value="svet">Svet</option>
      <option value="ekonomika">Ekonomika</option>
      <option value="sport">Šport</option>
      <option value="zahrada">Záhrada</option>
      <option value="recepty">Recepty</option>
      <option value="zahady">Záhady a fenomény</option>
    </select>
  </label>

  <!-- Recept má vlastnú štruktúru (suroviny/postup/časy), nie voľný text —
       rovnaký formát, aký kódom skladá formatRecept() v redakcia/lib/flow/
       17-recepty.js (ten generátor je vypnutý, tento formulár je teraz
       jediná cesta, ako recept pribudne). JS nižšie z týchto polí poskladá
       presne ten istý text a pošle ho ako obyčajné pole "text" — server sa
       nemení, recepty.html aj stránka článku ho rozparsujú rovnako, či prišiel
       odtiaľto alebo od generátora. -->
  <fieldset id="receptFields" style="display:none; border:1px solid #ddd; border-radius:6px; padding:4px 14px 14px; margin-top:16px;">
    <legend style="padding:0 6px; font-weight:600; font-size:0.9rem;">Recept</legend>

    <label>Podkategória
      <select name="receptKategoria">
        <option value="Hlavné jedlá">Hlavné jedlá</option>
        <option value="Polievky">Polievky</option>
        <option value="Dezerty">Dezerty</option>
        <option value="Bezmäsité a fit">Bezmäsité a fit</option>
      </select>
    </label>

    <label>Úvod (2-4 vety pred receptom)
      <textarea name="receptIntro" style="min-height:70px"></textarea>
    </label>

    <div style="display:flex; gap:12px;">
      <label style="flex:1">Príprava (min)
        <input type="number" name="receptPrep" min="0" placeholder="15">
      </label>
      <label style="flex:1">Varenie (min)
        <input type="number" name="receptCook" min="0" placeholder="25">
        <small>Nechaj prázdne/0, keď sa nič nevarí ani nepečie.</small>
      </label>
      <label style="flex:1">Porcie
        <input type="number" name="receptServings" min="1" placeholder="4">
      </label>
    </div>

    <label>Suroviny
      <textarea name="receptSuroviny" placeholder="500 g mleté mäso&#10;1 ks cibuľa&#10;podľa chuti soľ, korenie"></textarea>
      <small>Jedna surovina na riadok, množstvo aj názov spolu (napr. "500 g mleté mäso").</small>
    </label>

    <label>Postup
      <textarea name="receptPostup" placeholder="Cibuľu nakrájame nadrobno a orestujeme.&#10;Pridáme mäso a opekáme dozlata."></textarea>
      <small>Jeden krok na riadok, čísla pred krokmi dopĺňa web sám — nepíš ich.</small>
    </label>
  </fieldset>

  <fieldset id="zahadyFields">
    <legend>Záhady a fenomény</legend>
    <label>Podkategória
      <select name="subcategory">
        <option value="zahady">Záhady sveta</option>
        <option value="historia">História</option>
        <option value="vesmir">Vesmír</option>
        <option value="legendy">Legendy</option>
        <option value="ezoterika">Ezoterika</option>
      </select>
    </label>
    <input type="hidden" name="contentType" value="F">
    <input type="hidden" name="series" value="">
    <input type="hidden" name="canonicalTopic" value="">
    <input type="hidden" name="topicAliases" value="">
    <input type="hidden" name="newAngleReason" value="">
    <input type="hidden" name="country" value="">
    <input type="hidden" name="location" value="">
    <input type="hidden" name="historicalPeriod" value="">
    <input type="hidden" name="persons" value="">
    <input type="hidden" name="mainEntities" value="">
    <input type="hidden" name="sourcesText" value="">
    <input type="hidden" name="imageKind" value="photo">
    <input type="hidden" name="seoTitle" value="">
    <input type="hidden" name="metaDescription" value="">
    <input type="hidden" name="focusKeyword" value="">
    <input type="hidden" name="secondaryKeywords" value="">
    <input type="hidden" name="tags" value="">
  </fieldset>

  <label class="standardSource">Zdroj (meno)
    <input type="text" name="source" placeholder="napr. Polícia SR">
  </label>

  <label class="standardSource">Zdroj (odkaz)
    <input type="url" name="sourceUrl" placeholder="https://...">
  </label>

  <label>Vlastná fotka (voliteľné)
    <input type="file" name="imageFile" id="imageFile" accept="image/jpeg,image/png,image/webp,image/gif,image/avif">
    <small>Vyber súbor z počítača alebo telefónu. Má prednosť pred odkazom aj pred AI ilustráciou. Maximum 4 MB.</small>
  </label>

  <label>Zdroj obrázka (autor, agentúra)
    <input type="text" name="imageCredit" placeholder="napr. Ján Novák / TASR, alebo Vlastná fotografia">
    <small>Vyplň pri vlastnej alebo prevzatej fotke — zobrazí sa pod obrázkom v článku. Pri AI ilustrácii nechaj prázdne, tam sa uvádza automatický popisok.</small>
  </label>

  <label>Obrázok (odkaz, voliteľné)
    <input type="url" name="imageUrl" placeholder="https://....supabase.co/... (nechaj prázdne, ak nahrávaš fotku vyššie)">
    <small>Funguje len odkaz do vlastného úložiska (<code>*.supabase.co</code>). Odkaz z iného webu prehliadač zablokuje kvôli CSP, tak ho formulár odmietne.</small>
  </label>

  <label style="display:flex; align-items:center; gap:8px; font-weight:normal;">
    <input type="checkbox" name="generateAiImage" value="true" style="width:auto; margin:0;">
    Vygenerovať AI ilustráciu (ak nie je zadaný odkaz vyššie)
  </label>

  <label>Vlastný prompt pre AI ilustráciu (voliteľné)
    <input type="text" name="imagePrompt" placeholder="napr. golden bitcoin coin over dark city skyline, dramatic lighting">
    <small>Nechaj prázdne a zaškrtni políčko vyššie, ak chceš automatický prompt podľa titulku/kategórie. Vyplň toto pole, ak chceš vlastnú predstavu — netreba potom zaškrtávať checkbox.</small>
  </label>

  <label>Naplánovať zverejnenie (voliteľné)
    <input type="datetime-local" name="publishAt" id="publishAt">
    <small>Nechaj prázdne pre okamžité publikovanie. Naplánovaný čas je orientačný — kontroluje sa každých 5 minút, nie na sekundu presne. Zadávaj vo svojom miestnom (bratislavskom) čase.</small>
  </label>

  <button type="button" id="previewBtn" class="secondary">Náhľad</button>
  <button type="submit" id="btn">Publikovať</button>
</form>

<div id="preview" aria-live="polite"></div>
<div id="status"></div>

<script>
// Zmenšenie fotky ešte v prehliadači. Bez neho išiel súbor do úložiska 1:1
// taký, aký vyšiel z fotoaparátu — ručne nahrané fotky mali priemer 1,1 MB,
// kým generované webp majú 50 kB. Crawleri (Ahrefs, Google, náhľady na
// sieťach) ťahajú obrázok ku každému článku zo sitemapu, takže to bol hlavný
// zdroj egressu zo Supabase.
const MAX_SIRKA = 1600;
const KVALITA = 0.82;

// Vráti { blob, typ }. Keď sa zmenšiť nedá alebo by to nepomohlo, vráti
// pôvodný súbor — nikdy nezhoršuj.
async function zmensiFotku(subor) {
  const povodne = { blob: subor, typ: subor.type };
  // Animovaný GIF by prevodom prišiel o animáciu, ten nechávame tak.
  if (subor.type === 'image/gif') return povodne;
  try {
    // imageOrientation: 'from-image' rešpektuje EXIF otočenie. Bez toho by
    // fotky z mobilu mohli skončiť otočené naležato.
    const bitmap = await createImageBitmap(subor, { imageOrientation: 'from-image' });
    const mierka = Math.min(1, MAX_SIRKA / bitmap.width);   // nikdy nezväčšuj
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(bitmap.width * mierka);
    canvas.height = Math.round(bitmap.height * mierka);
    canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
    bitmap.close();
    const blob = await new Promise((res) => canvas.toBlob(res, 'image/webp', KVALITA));
    // Keď prehliadač webp nevie, toBlob ticho vráti PNG — to môže byť väčšie
    // než originál. Preto sa rozhodujeme podľa veľkosti, nie podľa formátu,
    // a typ berieme z blobu, nie natvrdo.
    if (!blob || blob.size >= subor.size) return povodne;
    return { blob, typ: blob.type || 'image/webp' };
  } catch (err) {
    console.warn('[foto] zmenšenie zlyhalo, posielam originál:', err);
    return povodne;
  }
}

// Prepínanie "Text článku" ↔ štruktúrovaný "Recept" podľa kategórie. Bez
// tohto by pri recepte ostal prázdny povinný textarea (required) a formulár
// by sa nedal odoslať, aj keby boli recept-polia vyplnené.
const categorySelect = document.getElementById('categorySelect');
const textField = document.getElementById('textField');
const receptFields = document.getElementById('receptFields');
const zahadyFields = document.getElementById('zahadyFields');
function toggleReceptFields() {
  const jeRecept = categorySelect.value === 'recepty';
  const suZahady = categorySelect.value === 'zahady';
  receptFields.style.display = jeRecept ? 'block' : 'none';
  zahadyFields.style.display = suZahady ? 'block' : 'none';
  textField.closest('label').style.display = jeRecept ? 'none' : 'block';
  textField.required = !jeRecept;
}
categorySelect.addEventListener('change', toggleReceptFields);
toggleReceptFields();

document.getElementById('loadArticleBtn').addEventListener('click', async () => {
  const f = document.getElementById('f');
  const id = f.elements.articleId.value.trim();
  const status = document.getElementById('status');
  if (!id) { status.className = 'err'; status.textContent = 'Zadaj ID článku.'; return; }
  try {
    const res = await fetch('/.netlify/functions/manual-publish', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'load', password: f.elements.password.value, articleId: id }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Článok sa nepodarilo načítať.');
    const article = data.article;
    for (const key of ['headline','perex','text','category','subcategory','contentType','series','canonicalTopic','newAngleReason','country','location','historicalPeriod','imageKind','seoTitle','metaDescription','focusKeyword','imageUrl','imageCredit']) {
      if (f.elements[key]) f.elements[key].value = article[key] || '';
    }
    f.elements.topicAliases.value = (article.aliases || []).join(', ');
    for (const key of ['persons','mainEntities','secondaryKeywords','tags']) f.elements[key].value = (article[key] || []).join(', ');
    f.elements.sourcesText.value = (article.sources || []).map((s) => `${s.name} | ${s.url}`).join('\n');
    if (article.sources?.[0]) {
      f.elements.source.value = article.sources[0].name || '';
      f.elements.sourceUrl.value = article.sources[0].url || '';
    }
    toggleReceptFields();
    status.className = 'ok'; status.textContent = 'Článok načítaný. Po úprave tlačidlo Publikovať aktualizuje tú istú adresu.';
  } catch (e) { status.className = 'err'; status.textContent = e.message; }
});

function esc(s) { return String(s || '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
document.getElementById('previewBtn').addEventListener('click', () => {
  const f = document.getElementById('f');
  const d = Object.fromEntries(new FormData(f));
  const box = document.getElementById('preview');
  const body = d.category === 'recepty' ? poskladajReceptText(d) : d.text;
  box.innerHTML = `<small>${esc(d.category === 'zahady' ? d.subcategory + ' · ' + d.contentType : d.category)}</small>`
    + `<h2>${esc(d.headline)}</h2><p><strong>${esc(d.perex)}</strong></p>`
    + String(body || '').split(/\n+/).filter(Boolean).map((p) => d.category === 'zahady' && /^## [^\n]{1,120}$/.test(p) ? `<h3>${esc(p.slice(3))}</h3>` : `<p>${esc(p)}</p>`).join('');
  box.style.display = 'block';
  box.scrollIntoView({ behavior: 'smooth' });
});

// Poskladá text articleu z recept-polí presne tak, ako to kódom robí
// formatRecept() v redakcia/lib/flow/17-recepty.js — rovnaké poradie
// odsekov (¶¶ delenie rieši až paragraphsToCell() na serveri, tu stačí
// oddeliť dvojitým Enterom). Vyhodí Error, keď niečo povinné chýba —
// odchytáva ho volajúci try/catch v submit handleri.
function poskladajReceptText(data) {
  const suroviny = String(data.receptSuroviny || '').split('\n').map((s) => s.trim()).filter(Boolean);
  const postup = String(data.receptPostup || '').split('\n').map((s) => s.trim()).filter(Boolean);
  const intro = String(data.receptIntro || '').trim();
  const prep = data.receptPrep !== '' ? Number(data.receptPrep) : NaN;
  const cook = data.receptCook !== '' ? Number(data.receptCook) : 0;
  const servings = data.receptServings !== '' ? Number(data.receptServings) : NaN;

  if (!intro) throw new Error('Recept potrebuje úvod.');
  if (isNaN(prep)) throw new Error('Recept potrebuje čas prípravy (min).');
  if (isNaN(servings)) throw new Error('Recept potrebuje počet porcií.');
  if (!suroviny.length) throw new Error('Recept potrebuje aspoň jednu surovinu.');
  if (!postup.length) throw new Error('Recept potrebuje aspoň jeden krok postupu.');

  let meta = `Príprava: ${prep} min`;
  if (cook > 0) meta += ` · Varenie: ${cook} min`;
  meta += ` · Porcie: ${servings}`;

  return [
    intro,
    `Kategória: ${data.receptKategoria}`,
    meta,
    'Suroviny:',
    ...suroviny,
    'Postup:',
    ...postup.map((s, i) => `${i + 1}. ${s}`),
  ].join('\n\n');
}

function nazovZdrojaZUrl(url) {
  try {
    return new URL(url).hostname.replace(/^www\./, '');
  } catch {
    return '';
  }
}

function doplnZahadyMetadata(data) {
  data.canonicalTopic = String(data.canonicalTopic || data.headline || '').trim();
  data.contentType = data.contentType || {
    zahady: 'M', miesta: 'M', legendy: 'L', povery: 'L',
    magia: 'E', ezoterika: 'E', sny: 'E', astrologia: 'E',
    tarot: 'E', numerologia: 'E',
  }[data.subcategory] || 'F';

  if (data.generateAiImage || String(data.imagePrompt || '').trim()) {
    data.imageKind = 'ai';
  } else {
    data.imageKind = data.imageKind || 'photo';
  }

  const zdrojeZKonceptu = String(data.sourcesText || '').split('\n').map((line) => {
    const cut = line.indexOf('|');
    if (cut < 1) return null;
    return { name: line.slice(0, cut).trim(), url: line.slice(cut + 1).trim() };
  }).filter(Boolean);
  if (zdrojeZKonceptu.length) {
    data.sources = zdrojeZKonceptu;
    return;
  }

  const url = String(data.sourceUrl || '').trim();
  if (!url) throw new Error('Pri Záhadách zadaj aj odkaz na zdroj.');
  data.sources = [{
    name: String(data.source || '').trim() || nazovZdrojaZUrl(url) || 'Zdroj',
    url,
  }];
}

document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn');
  const status = document.getElementById('status');
  const data = Object.fromEntries(new FormData(e.target));

  btn.disabled = true;
  btn.textContent = 'Publikujem...';
  // Viditeľnosť riadi VÝHRADNE trieda, nie inline štýl. CSS má
  // #status{display:none} a #status.ok/.err{display:block} — a inline
  // `style="display:none"` by tie pravidlá prebil, takže hláška o chybe sa
  // nikdy nezobrazila a formulár po odoslaní vyzeral, že nerobí nič.
  status.className = '';

  try {
    if (data.category === 'recepty') {
      data.text = poskladajReceptText(data);
    }
    if (data.category === 'zahady') {
      doplnZahadyMetadata(data);
    }
    delete data.sourcesText;
    // Pomocné polia manual-publish.js nepozná — nemá zmysel ich posielať
    // (a keby náhodou nemal server whitelist tvrdý, len by to bola zbytočná
    // dátová záťaž navyše).
    delete data.receptKategoria; delete data.receptIntro; delete data.receptPrep;
    delete data.receptCook; delete data.receptServings; delete data.receptSuroviny; delete data.receptPostup;

    // datetime-local dáva "2026-09-12T18:30" bez časovej zóny — new Date(...)
    // ju vyloží v miestnom čase PREHLIADAČA (tvojom, keď píšeš článok), takže
    // .toISOString() pošle serveru jednoznačný UTC okamih namiesto reťazca,
    // ktorý by si server musel sám hádať, v akej zóne bol napísaný.
    if (data.publishAt) {
      const d = new Date(data.publishAt);
      if (isNaN(d)) throw new Error('Neplatný dátum naplánovania.');
      data.publishAt = d.toISOString();
    } else {
      delete data.publishAt;
    }

    // Fotku najprv zmenšíme (viď zmensiFotku hore), až potom ju pošleme ako
    // base64 v JSON tele. Netlify má strop ~6 MB na telo a base64 nafúkne dáta
    // o ~37 %, preto 4 MB. Po zmenšení sa ten strop prakticky nedá dosiahnuť,
    // takže formulár vezme aj fotku rovno z mobilu — predtým ju odmietol.
    // Funkcia si veľkosť aj typ overuje znova, toto je pre pohodlie.
    const subor = document.getElementById('imageFile').files[0];
    delete data.imageFile;
    if (subor) {
      btn.textContent = 'Spracúvam fotku...';
      const { blob, typ } = await zmensiFotku(subor);
      const MAX = 4 * 1024 * 1024;
      if (blob.size > MAX) {
        throw new Error('Fotka má aj po zmenšení ' + (blob.size / 1024 / 1024).toFixed(1) + ' MB, maximum je 4 MB. Skús inú.');
      }
      btn.textContent = 'Nahrávam fotku...';
      let bin = '';
      const bytes = new Uint8Array(await blob.arrayBuffer());
      for (let i = 0; i < bytes.length; i += 8192) {
        bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
      }
      data.imageBase64 = btoa(bin);
      data.imageType = typ;
      btn.textContent = 'Publikujem...';
    }

    const res = await fetch('/.netlify/functions/manual-publish', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data),
    });
    const j = await res.json();
    if (res.ok && j.ok) {
      status.className = 'ok';
      if (j.scheduled) {
        const cas = new Date(j.publishAt).toLocaleString('sk-SK', { dateStyle: 'medium', timeStyle: 'short' });
        status.textContent = '🕒 Naplánované na ' + cas + ' (id: ' + j.id + '). Zverejní sa automaticky, keď príde čas (kontrola každých 5 minút).';
      } else if (j.updated) {
        status.textContent = '✅ Článok aktualizovaný (id: ' + j.id + ').'
          + (j.registry && !j.registry.synced ? ' Evidenciu témy treba dosynchronizovať.' : '');
      } else {
        status.textContent = '✅ Publikované (id: ' + j.id + '). Telegram: ' + j.telegram
          + (data.category === 'zahady' && j.registry && !j.registry.synced ? ' Evidenciu témy treba dosynchronizovať.' : '');
      }
      e.target.reset();
      toggleReceptFields();
      document.getElementById('preview').style.display = 'none';
    } else {
      status.className = 'err';
      status.textContent = '❌ ' + (j.error || 'neznáma chyba') + ' (HTTP ' + res.status + ')';
      console.error('[publikovat] server odmietol:', res.status, j);
    }
  } catch (err) {
    status.className = 'err';
    status.textContent = '❌ ' + err.message;
    console.error('[publikovat] zlyhalo:', err);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Publikovať';
  }
});
</script>
<script src="/assets/zahady/draft.js"></script>
</body>
</html>

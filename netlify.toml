# Zverejňuje sa LEN _site/, ktorý poskladá scripts/build-site.sh.
# Predtým tu bolo publish = ".", čo zverejňovalo celý repozitár — na webe boli
# verejne dostupné netlify/lib/*.js aj package.json (overené HTTP 200), a po
# zlúčení s redakciou by pribudli CLAUDE.md, PLAN.txt a db/schema.sql.
# Podrobnosti v scripts/build-site.sh.
[build]
  command = "bash scripts/build-site.sh"
  publish = "_site"
  functions = "netlify/functions"

# Skener tajomstiev nekontroluje len zverejnený priečinok, ale aj súbory
# repozitára. Priečinok redakcia/ je lokálna pipeline — na Netlify sa nenasadzuje
# ani nezverejňuje, len tam leží. Obsahuje pritom content/krypto-skola/.images.json
# s verejnými URL obrázkov, ktoré začínajú hodnotou SUPABASE_URL. Skener to
# vyhodnotí ako únik premennej a zhodí build (deploye 1653552 a 2066b29).
# Vynechávame teda celý priečinok — nie kontrolu ako takú, tá pre web platí ďalej.
[build.environment]
  SECRETS_SCAN_OMIT_PATHS = "redakcia/**"

[functions]
  node_bundler = "esbuild"

[dev]
  publish = "."

# Content-Security-Policy tu ZÁMERNE nie je — generuje ju scripts/gen-csp.mjs
# do _site/_headers pri každom builde, lebo obsahuje SHA-256 hashe inline
# skriptov. Natvrdo zapísaná by sa pri prvej úprave HTML rozišla s obsahom
# a ticho by zhodila všetok JavaScript na webe.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()"

# ─── CRON ÚLOHY ───
# Pripravuje hotové spravodajstvo do cache (vďaka tomu je web rýchly).
[functions."refresh-feeds"]
  schedule = "*/10 * * * *"

# Generátory vlastných SK článkov – ČASOVO ROZLOŽENÉ, aby nešli naraz
# (predtým o polnoci bežali všetky súčasne a vznikali kolízie ID + duplicity).
#
# generate-krypto VYPNUTÝ (2026-07-05): krypto + AI obsah teraz produkuje
# výhradne novinko-redakcia (fact-only pipeline, píše do rovnakého Sheetu).
# Bežať oboje súčasne = duplicitný/konkurenčný obsah. Funkcia (generate-krypto.js)
# ostáva v repozitári nedotknutá, len bez schedule — nespustí sa sama.
# [functions."generate-krypto"]
#   schedule = "5 */4 * * *"

[functions."generate-svet"]
  schedule = "15 */5 * * *"

[functions."generate-sport"]
  schedule = "25 */2 * * *"

